[package]
name = "faf-sim-cli"
version = "0.1.0"
edition = "2021"
authors = ["octopus contributors"]
description = "CLI for the FAF headless build-queue simulator."
license = "MIT"

[[bin]]
name = "faf-sim"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
faf-sim = { workspace = true, default-features = false, features = ["headless"] }
futures-util = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tokio-tungstenite = "0.24"
