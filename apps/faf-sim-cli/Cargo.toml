[package]
name = "faf-sim-cli"
version = "0.1.0"
edition = "2021"
authors = ["octopus contributors"]
description = "Research CLI for FAF build-order simulation and optimization."
license = "MIT"

[[bin]]
name = "faf-sim"
path = "src/main.rs"

[features]
default = ["cuda"]
cpu = ["faf-sim/cpu", "faf-sim-tui/cpu"]
cuda = ["faf-sim/cuda", "faf-sim-tui/cuda"]
wgpu = ["faf-sim/wgpu", "faf-sim-tui/wgpu"]

[dependencies]
clap = { workspace = true }
ctrlc = "3"
faf-sim = { workspace = true, default-features = false }
faf-sim-tui = { workspace = true, default-features = false, features = ["cuda"] }
faf-units = { workspace = true }
petgraph = { workspace = true }
petgraph-svg = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
