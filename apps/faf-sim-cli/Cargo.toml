[package]
name = "faf-sim-cli"
version = "0.1.0"
edition = "2021"
authors = ["octopus contributors"]
description = "CLI for the FAF build-queue simulator."
license = "MIT"

[[bin]]
name = "faf-sim"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
faf-blueprints = { workspace = true }
faf-build-prediction = { workspace = true }
faf-build-scheduler = { workspace = true }
faf-quantities = { workspace = true }
faf-sim = { workspace = true, default-features = false, features = ["headless"] }
faf-sim-service = { workspace = true }
faf-sim-shared = { workspace = true }
faf-solver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
