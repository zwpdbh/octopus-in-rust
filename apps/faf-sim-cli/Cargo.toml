[package]
name = "faf-sim-cli"
version = "0.1.0"
edition = "2021"
authors = ["octopus contributors"]
description = "CLI for the FAF headless build-queue simulator."
license = "MIT"

[[bin]]
name = "faf-sim"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
faf-sim = { workspace = true, default-features = false, features = ["headless"] }
serde_json = { workspace = true }
