[package]
name = "faf-sim-cli"
version = "0.1.0"
edition = "2021"
authors = ["octopus contributors"]
description = "Research CLI for FAF build-order simulation and optimization."
license = "MIT"

[[bin]]
name = "faf-sim"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
faf-sim = { workspace = true }
faf-units = { workspace = true }
petgraph = { workspace = true }
petgraph-svg = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
