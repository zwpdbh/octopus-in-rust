<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAF Eco Sim</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0d1117;
            color: #c9d1d9;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #status {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            padding: 1rem;
            max-width: 80%;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="status">
        <p>Loading FAF Eco Sim…</p>
        <p>If this message stays, make sure <code>faf_sim.js</code> and <code>faf_sim_bg.wasm</code> were generated by <code>wasm-bindgen</code>.</p>
    </div>
    <script type="module">
        const status = document.getElementById('status');
        try {
            const { default: init } = await import('./faf_sim.js');
            await init();
            status.classList.add('hidden');
        } catch (e) {
            console.error(e);
            status.innerHTML = `<p>Failed to start the simulator.</p><pre>${e}</pre>`;
        }
    </script>
</body>
</html>
