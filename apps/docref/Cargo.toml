[package]
name = "docref"
version = "0.1.0"
edition = "2024"
authors = ["Octopus Team"]
description = "Keep markdown documentation in sync with code via source-location comments"
license = "MIT"

[[bin]]
name = "docref"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
rusqlite = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
walkdir = { workspace = true }
sha2 = { workspace = true }
hex = "0.4"
dirs = "6"
which = "7"

[dev-dependencies]
tempfile = { workspace = true }
