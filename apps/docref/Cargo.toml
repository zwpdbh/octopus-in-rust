[package]
name = "docref"
version = "0.1.0"
edition = "2024"
authors = ["Octopus Team"]
description = "Keep markdown documentation in sync with code via source-location comments"
license = "MIT"

[[bin]]
name = "docref"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.33", features = ["bundled"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"
sha2 = "0.10"
hex = "0.4"
dirs = "6"
which = "7"

[dev-dependencies]
tempfile = "3"
