[package]
name = "octopus-cli"
version = "0.1.0"
edition = "2024"
authors = ["Octopus Team"]
description = "A faithful Rust rewrite of kimi-cli"
license = "MIT"

[[bin]]
name = "octopus"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { workspace = true, features = ["full"] }
tokio-util = "0.7"

# CLI parsing
clap = { workspace = true, features = ["env", "cargo"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_yml = "0.0"
toml = { workspace = true }

# Templating (Jinja2 with ${...} delimiters)
minijinja = { version = "2", features = ["custom_syntax"] }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["json"] }

# HTTP / API
reqwest = { workspace = true, features = ["json", "stream"] }

# Terminal UI
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }

# Markdown / syntax highlighting
syntect = "5"
pulldown-cmark = "0.12"

# Utilities
uuid = { workspace = true, features = ["v4", "serde"] }
chrono = { workspace = true }
directories = "5"
dirs = "5"
sha2 = { workspace = true }
base64 = "0.22"
regex = { workspace = true }
glob = "0.3"
lazy_static = "1"
once_cell = "1"
indexmap = "2"
dashmap = "6"
async-trait = { workspace = true }
futures = { workspace = true }

# OAuth / auth
oauth2 = "4"
webbrowser = "1"

# Config / validation
config = "0.15"
validator = { version = "0.19", features = ["derive"] }

# Process management
sysinfo = "0.33"

# Web server (for vis/web UIs)
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors"] }

# Wire protocol / MCP
schemars = { workspace = true }

# Kosong LLM abstraction layer
kosong = { workspace = true }

# Reusable agent core
brain = { workspace = true }

# Unicode display width
unicode-width = "0.2"

walkdir = { workspace = true }
zip = { version = "2", default-features = false, features = ["deflate"] }

# Randomness for retry jitter
rand = { workspace = true }
arboard = "3.6.1"
extism = { workspace = true }

# Development
# Note: many of these are placeholders for future implementation
