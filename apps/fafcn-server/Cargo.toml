[package]
name = "fafcn-server"
version = "0.1.0"
edition = "2021"
authors = ["octopus contributors"]
description = "Backend server for the fafcn-web construction simulator."
license = "MIT"

[[bin]]
name = "fafcn-server"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true, features = ["ws"] }
faf-blueprints = { workspace = true }
faf-sim-protocol = { workspace = true }
faf-sim-service = { workspace = true }
faf-units = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower-http = { workspace = true, features = ["fs", "trace", "cors"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
