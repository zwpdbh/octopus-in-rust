[package]
name = "octopus-cli"
version = "0.1.0"
edition = "2024"
authors = ["Octopus Team"]
description = "A faithful Rust rewrite of kimi-cli"
license = "MIT"

[[bin]]
name = "octopus"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"

# CLI parsing
clap = { version = "4", features = ["derive", "env", "cargo"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# HTTP / API
reqwest = { version = "0.12", features = ["json", "stream"] }

# Terminal UI
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }

# Markdown / syntax highlighting
syntect = "5"
pulldown-cmark = "0.12"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
directories = "5"
dirs = "5"
sha2 = "0.10"
base64 = "0.22"
regex = "1"
glob = "0.3"
lazy_static = "1"
once_cell = "1"
indexmap = "2"
dashmap = "6"
async-trait = "0.1"
futures = "0.3"

# OAuth / auth
oauth2 = "4"

# Config / validation
config = "0.15"
validator = { version = "0.19", features = ["derive"] }

# Process management
sysinfo = "0.33"

# Web server (for vis/web UIs)
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors"] }

# Wire protocol / MCP
schemars = "0.8"

# Kosong LLM abstraction layer
kosong = { path = "../kosong" }

# Unicode display width
unicode-width = "0.2"

walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

# Randomness for retry jitter
rand = "0.8"
arboard = "3.6.1"

# Development
# Note: many of these are placeholders for future implementation
