[workspace]
members = [
    "apps/octopus-cli",
    "crates/kosong",
    "crates/brain",
    "crates/faf-units",
    "crates/faf-sim",
    "crates/faf-sim-tui",
    "crates/petgraph-svg",
    "crates/faf-downloader",
    "plugins/example-http",
    "plugins/faf-units",
    "plugins/faf-party",
    "apps/docref",
    "apps/faf-sim-cli",
    "apps/qqbot",
    "apps/qqbot-core",
    "xtask",
]
resolver = "3"

[workspace.dependencies]
# Path crates
faf-sim = { path = "crates/faf-sim", default-features = false }
faf-sim-tui = { path = "crates/faf-sim-tui", default-features = false }
faf-units = { path = "crates/faf-units" }
kosong = { path = "crates/kosong" }
brain = { path = "crates/brain" }
qqbot-config = { path = "crates/qqbot-config" }
petgraph-svg = { path = "crates/petgraph-svg" }

# Common external crates
anyhow = "1"
async-trait = "0.1"
burn = { version = "0.21", default-features = false, features = ["std", "autodiff"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
extism = "1"
extism-pdk = "1"
futures = "0.3"
futures-util = "0.3"
http = "1"
petgraph = "0.8"
rand = "0.10"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rusqlite = { version = "0.33", features = ["bundled"] }
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tempfile = "3"
tokio = { version = "1", default-features = false }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
tokio-test = "0.4"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = "1"
walkdir = "2"
