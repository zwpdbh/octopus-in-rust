[package]
name = "brain"
version = "0.1.0"
edition = "2024"
authors = ["Octopus Team"]
description = "Reusable agent core (Brain) for octopus-cli and qqbot-core"
license = "MIT"

[dependencies]
kosong = { path = "../kosong" }

async-trait = "0.1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
rand = "0.8"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Plugin sandboxing
extism = "1"
dirs = "5"

[dev-dependencies]
tokio-test = "0.4"
