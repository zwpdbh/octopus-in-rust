[package]
name = "faf-sim-tui"
version = "0.1.0"
edition = "2021"
authors = ["octopus contributors"]
description = "Terminal dashboard for faf-sim policy training."
license = "MIT"

[features]
default = ["cpu"]
cpu = ["faf-sim/cpu"]
cuda = ["faf-sim/cuda"]
wgpu = ["faf-sim/wgpu"]

[dependencies]
crossterm = { version = "0.28", features = ["event-stream"] }
faf-sim = { workspace = true, default-features = false }
ratatui = "0.29"
