[package]
name = "faf-build-prediction"
version = "0.1.0"
edition = "2021"
authors = ["octopus contributors"]
description = "Neural network for predicting FAF build-plan completion times."
license = "MIT"

[dependencies]
anyhow = { workspace = true }
burn = { workspace = true, features = ["train", "ndarray", "dataset", "tui", "metrics"] }
faf-blueprints = { workspace = true }
faf-quantities = { workspace = true }
faf-sim = { workspace = true, default-features = false, features = ["headless"] }
faf-sim-shared = { workspace = true }
faf-solver = { workspace = true }
faf-units = { workspace = true }
rand = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
