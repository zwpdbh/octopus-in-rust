[package]
name = "faf-sim"
version = "0.1.0"
edition = "2021"
authors = ["octopus contributors"]
description = "Simulation and build-order planning for Forged Alliance Forever (FAF)."
license = "MIT"

[dependencies]
burn = { version = "0.21", default-features = false, features = ["std", "ndarray", "autodiff"] }
faf-units = { path = "../faf-units" }
petgraph = "0.6"
tokio = { version = "1", features = ["sync", "rt", "macros", "time", "test-util"] }

[dev-dependencies]
serde_json = "1"
