[package]
name = "faf-sim"
version = "0.1.0"
edition = "2021"
authors = ["octopus contributors"]
description = "Simulation and build-order planning for Forged Alliance Forever (FAF)."
license = "MIT"

[features]
default = ["cpu"]
# CPU-only training (default for the library so tests run without a GPU).
cpu = ["burn/ndarray"]
# NVIDIA GPU training via the Burn CUDA backend.
cuda = ["burn/cuda", "burn/fusion", "burn/autotune"]
# Cross-platform GPU training via WebGPU (Vulkan/DirectX/Metal).
wgpu = ["burn/wgpu", "burn/fusion", "burn/autotune"]

[dependencies]
burn = { workspace = true, features = ["train", "tui"] }
faf-units = { workspace = true }
petgraph = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
