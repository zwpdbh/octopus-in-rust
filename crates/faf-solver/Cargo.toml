[package]
name = "faf-solver"
version = "0.1.0"
edition = "2021"
authors = ["octopus contributors"]
description = "Pure analytical completion-time solver for FAF build queues."
license = "MIT"

[dependencies]
faf-blueprints = { workspace = true }
faf-quantities = { workspace = true }
faf-sim-shared = { workspace = true }

[dev-dependencies]
faf-sim = { workspace = true, default-features = false, features = ["headless"] }
serde_json = { workspace = true }
