[package]
name = "faf-dioxus-ui"
version = "0.1.0"
edition = "2021"
authors = ["octopus contributors"]
description = "Reusable Dioxus UI primitives independent of business logic."
license = "MIT"

[dependencies]
dioxus = { workspace = true }
js-sys = "0.3"
petgraph = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
pulldown-cmark = "0.12"
plotters = { version = "0.3.7", default-features = false, features = ["line_series", "full_palette"] }
plotters-canvas = "0.3"
wasm-bindgen = { workspace = true }
web-sys = { workspace = true, features = ["console", "CustomEvent", "Document", "DomRectReadOnly", "Element", "Event", "EventTarget", "HtmlElement", "ResizeObserver", "ResizeObserverEntry", "Window", "Location"] }
