# qqbot supervisor configuration.
# This file is generated automatically by `qqbot setup`.

[qq]
account = 123456789

[napcat]
dir = "./napcat"
launcher = "napcat.sh"
data_dir = "./qqbot-data/napcat"
ws_port = 3001
webui_port = 6099

[core]
binary = "./qqbot-core"
plugin_dir = "./qqbot-data/plugins"
config_path = "./qqbot-data/config.toml"
allowed_groups = [123456789]

[llm]
api_key = "sk-xxxxxxxx"
api_url = "https://api.moonshot.cn/v1/chat/completions"
model = "moonshot-v1-8k"
