[package]
name = "qqbot"
version = "0.1.0"
edition = "2021"
authors = ["qqbot contributors"]
description = "Supervisor that starts and manages NapCatQQ and qqbot-core."
license = "MIT"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
daemonize = "0.5"
libc = "0.2"
nix = { version = "0.29", features = ["signal", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
