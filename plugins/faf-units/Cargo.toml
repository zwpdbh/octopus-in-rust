[package]
name = "faf-units-plugin"
version = "0.1.0"
edition = "2021"
authors = ["octopus contributors"]
description = "WASM plugin for querying and comparing FAF units."
license = "MIT"

[dependencies]
faf-units = { path = "../../crates/faf-units" }
extism-pdk = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
crate-type = ["cdylib"]
test = false
