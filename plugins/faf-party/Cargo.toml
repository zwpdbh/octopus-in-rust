[package]
name = "faf-party-plugin"
version = "0.1.0"
edition = "2021"
authors = ["octopus contributors"]
description = "WASM plugin for parsing FAF party availability and managing candidate state."
license = "MIT"

[dependencies]
extism-pdk = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"

[lib]
crate-type = ["cdylib"]
test = false
